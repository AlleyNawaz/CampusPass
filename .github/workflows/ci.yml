name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campuspass
          POSTGRES_USER: campuspass
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuspass -d campuspass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campuspass@localhost:5432/campuspass?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          node -e 'const { randomBytes } = require("node:crypto"); const fs = require("node:fs"); const values = { AUTH_PASSWORD_PEPPER: randomBytes(32).toString("base64url"), AUTH_MFA_ENCRYPTION_KEY_BASE64: randomBytes(32).toString("base64"), TICKET_CREDENTIAL_ENCRYPTION_KEY_BASE64: randomBytes(32).toString("base64"), SEED_STUDENT_PASSWORD: randomBytes(24).toString("base64url"), SEED_SCANNER_PASSWORD: randomBytes(24).toString("base64url") }; fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}`).join("\n") + "\n")'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
