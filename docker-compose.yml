services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuspass}
      POSTGRES_USER: ${POSTGRES_USER:-campuspass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local untracked .env file}
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspass -d campuspass"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - campuspass_postgres:/var/lib/postgresql/data

volumes:
  campuspass_postgres:
